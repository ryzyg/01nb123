<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Join your network</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
body{background:#f1f3f4;height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:#fff;width:520px;padding:60px 40px;border-radius:12px;text-align:center;box-shadow:0 1px 3px #00000022}
.icon{width:48px;height:48px;margin:0 auto 24px;color:#4285f4}
h1{font-size:24px;font-weight:500;color:#202124;margin-bottom:12px}
.desc{font-size:16px;color:#5f6368;margin-bottom:32px}
.btn{display:block;width:100%;padding:12px;background:#4285f4;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;margin-bottom:16px}
.link{font-size:14px;color:#5f6368}
.link a{color:#4285f4;text-decoration:none}
.bottom-text{margin-top:40px;font-size:12px;color:#80868b}
.bottom-text a{color:#4285f4;text-decoration:none}
</style>
</head>
<body>
<div class="box">
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<circle cx="12" cy="12" r="10"></circle>
<path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
</svg>
<h1>Join your network</h1>
<p class="desc">Connect this device to your Tailscale network</p>
<button class="btn">Sign in to your network</button>
<p class="link">Don't have an account? <a href="#">Sign up</a></p>
<p class="bottom-text">By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</p>
</div>
</body>
</html>
